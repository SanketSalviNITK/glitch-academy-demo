<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Student · Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
  <header class="hero">
    <h1>Demo Student</h1>
    <p>Web developer in training</p>
  </header>
  <main class="grid">
    <section id="about" class="card"><h2>About me</h2><p>I build things for the web and I'm learning 3D and JavaScript.</p></section>
    <section id="projects" class="card"><h2>Projects</h2><ul><li>Weather app</li><li>3D portfolio</li><li>Portfolio chatbot</li></ul></section>
    <section id="skills" class="card"><h2>Skills</h2><p>HTML · CSS · JavaScript · Three.js · Git</p></section>
  </main>
  <div id="chat">
    <div class="chat-title">💬 Ask my bot</div>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask me anything…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>
  <footer>Made during Glitch Academy</footer>
  <script type="module" src="bg.js"></script>
  <script src="chat.js" defer></script>
</body>
</html>
